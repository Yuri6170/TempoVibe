<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>VeloVibe 4.1.6 - JS Edition</title>
	<style>
		/* ==========================================
		   1. СТИЛИ И ПАЛИТРА (Аналог CustomTkinter)
		   ========================================== */
		:root {
			--bg-color: #0F0F0F;
			--panel-color: #1A1A1A;
			--lcd-bg: #051205;
			--text-green: #00FF41;
			--text-red: #FF3131;
			--btn-off: #2A2A2A;
			--btn-active: #004411;
		}
		
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: 'Courier New', Courier, monospace;
		}
		
		body {
			background-color: var(--bg-color);
			color: #FFF;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			padding: 20px;
		}
		
		.app-container {
			width: 100%;
			max-width: 620px;
			background-color: var(--bg-color);
			border: 1px solid #333;
			padding: 20px;
			display: flex;
			flex-direction: column;
			gap: 15px;
		}
		
		/* ДИСПЛЕЙ (LCD) */
		.lcd-display {
			background-color: var(--lcd-bg);
			border: 2px solid #333;
			padding: 15px;
		}
		
		.lcd-text {
			color: var(--text-green);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			margin-bottom: 5px;
		}
		
		.track-title { font-size: 16px; font-weight: bold; }
		.artist-name { font-size: 13px; }
		.playlist-name { font-size: 11px; color: #008822; }
		
		/* СЕТКА ЖАНРОВ */
		.genre-panel {
			background-color: var(--panel-color);
			border: 1px solid #222;
			padding: 15px;
			display: grid;
			grid-template-columns: repeat(5, 1fr);
			gap: 6px;
		}
		
		.genre-btn {
			background-color: var(--btn-off);
			color: #666;
			border: none;
			height: 35px;
			font-size: 9px;
			font-weight: bold;
			cursor: pointer;
			transition: 0.2s;
		}
		
		.genre-btn.active {
			background-color: var(--btn-active);
			color: var(--text-green);
		}
		
		/* ТЕМП И СЛАЙДЕР */
		.tempo-panel {
			background-color: var(--panel-color);
			padding: 20px;
			text-align: center;
		}
		
		.cadence-val {
			font-size: 52px;
			font-weight: bold;
			color: #FFF;
		}
		
		.slider {
			width: 100%;
			margin: 15px 0;
			accent-color: var(--text-green);
			cursor: pointer;
		}
		
		.sync-btn {
			width: 100%;
			height: 50px;
			background-color: #333;
			color: white;
			border: none;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
		}
		
		.sync-btn:hover {
			background-color: var(--text-green);
			color: #000;
		}
		
		/* КНОПКИ УПРАВЛЕНИЯ ПЛЕЕРОМ */
		.controls-panel {
			display: flex;
			gap: 5px;
		}
		
		.ctrl-btn {
			background-color: var(--btn-off);
			color: #FFF;
			border: none;
			height: 45px;
			flex: 1;
			font-size: 16px;
			cursor: pointer;
		}
		
		.ctrl-btn.like-btn.liked {
			background-color: var(--text-red);
			color: white;
		}
		
		.save-pl-btn {
			width: 100%;
			height: 40px;
			background-color: var(--btn-off);
			color: #FFF;
			border: none;
			font-size: 11px;
			font-weight: bold;
			cursor: pointer;
		}
		
		.save-pl-btn:hover { background-color: #e6b800; color: #000; }
		
		/* СТАТУС БАР */
		.status-bar {
			font-size: 11px;
			color: #555;
			text-align: center;
			margin-top: 5px;
		}
	</style>
</head>
<body>

<div class="app-container">
	<div class="lcd-display">
		<div id="trackLabel" class="lcd-text track-title">TRK: ---</div>
		<div id="artistLabel" class="lcd-text artist-name">ART: ---</div>
		<div id="playlistLabel" class="lcd-text playlist-name">PL: ---</div>
	</div>
	
	<div class="genre-panel" id="genreContainer"></div>
	
	<div class="tempo-panel">
		<div id="cadenceDisplay" class="cadence-val">85 RPM</div>
		<input type="range" id="cadenceSlider" class="slider" min="60" max="250" value="85">
		<button id="syncBtn" class="sync-btn">⚡ SYNC/RES RHYTHM</button>
	</div>
	
	<div class="controls-panel">
		<button class="ctrl-btn" id="prevBtn">|&lt;</button>
		<button class="ctrl-btn" id="pauseBtn" style="flex: 2;">|| / &gt;</button>
		<button class="ctrl-btn" id="nextBtn">&gt;|</button>
		<button class="ctrl-btn like-btn" id="likeBtn">❤</button>
	</div>
	
	<button id="savePlBtn" class="save-pl-btn">⭐ SAVE PLAYLIST TO LIBRARY</button>
	<div id="statusBar" class="status-bar">SYS: INITIALIZING...</div>
</div>

<script>
	// КОНФИГУРАЦИЯ SPOTIFY
	const CLIENT_ID = 'ТВОЙ_SPOTIFY_CLIENT_ID'; // Замени на свой Client ID из Spotify Developer Dashboard
	const REDIRECT_URI = window.location.origin + window.location.pathname;
	
	// СОСТОЯНИЕ ПРИЛОЖЕНИЯ
	let accessToken = null;
	let currentCadence = 85;
	let lastTrackId = null;
	const genreStates = {
		"ROCK": false, "METAL": false, "PHONK": false, "HARDSTYLE": false, "TECHNO": false,
		"INDUSTRIAL": false, "D&B": false, "ELECTRONIC": false, "SYNTHWAVE": false, "HIP-HOP": false
	};
	
	// DOM ЭЛЕМЕНТЫ
	const trackLabel = document.getElementById('trackLabel');
	const artistLabel = document.getElementById('artistLabel');
	const playlistLabel = document.getElementById('playlistLabel');
	const cadenceDisplay = document.getElementById('cadenceDisplay');
	const cadenceSlider = document.getElementById('cadenceSlider');
	const statusBar = document.getElementById('statusBar');
	const syncBtn = document.getElementById('syncBtn');
	const likeBtn = document.getElementById('likeBtn');
	
	// --- 1. АВТОРИЗАЦИЯ SPOTIFY (Implicit Grant Flow) ---
	function initSpotifyAuth() {
		const hash = window.location.hash.substring(1);
		const params = new URLSearchParams(hash);
		accessToken = params.get('access_token');
		
		if (!accessToken) {
			updateStatus("AUTHENTICATING WITH SPOTIFY...");
			const scopes = [
				'user-read-playback-state',
				'user-modify-playback-state',
				'user-library-modify',
				'playlist-modify-public',
				'playlist-modify-private',
				'user-library-read'
			].join('%20');
			
			const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${scopes}`;
			
			// Добавляем кнопку входа, если нет токена
			statusBar.innerHTML = `<a href="${authUrl}" style="color:#00FF41;">КЛИКНИТЕ ДЛЯ АВТОРИЗАЦИИ В SPOTIFY</a>`;
			return false;
		}
		
		window.location.hash = ''; // Очищаем хэш в URL
		updateStatus("READY | VELOVIBE ONLINE");
		startPlaybackMonitoring();
		return true;
	}
	
	// --- 2. ИНИЦИАЛИЗАЦИЯ ИНТЕРФЕЙСА ---
	function setupUI() {
		// Генерация кнопок жанров
		const genreContainer = document.getElementById('genreContainer');
		Object.keys(genreStates).forEach(genre => {
			const btn = document.createElement('button');
			btn.className = 'genre-btn';
			btn.innerText = genre;
			btn.onclick = () => {
				genreStates[genre] = !genreStates[genre];
				btn.classList.toggle('active', genreStates[genre]);
			};
			genreContainer.appendChild(btn);
		});
		
		// Слайдер темпа
		cadenceSlider.oninput = (e) => {
			currentCadence = parseInt(e.target.value);
			cadenceDisplay.innerText = `${currentCadence} RPM`;
		};
		
		// Кнопки управления
		syncBtn.onclick = searchAndPlay;
		document.getElementById('pauseBtn').onclick = togglePause;
		document.getElementById('nextBtn').onclick = nextTrack;
		document.getElementById('prevBtn').onclick = prevTrack;
		likeBtn.onclick = likeCurrentTrack;
		document.getElementById('savePlBtn').onclick = saveCurrentPlaylist;
	}
	
	// --- 3. РАБОТА С API SPOTIFY (Аналог spotipy) ---
	async function spotifyFetch(endpoint, options = {}) {
		if (!accessToken) return null;
		try {
			const response = await fetch(`https://api.spotify.com/v1${endpoint}`, {
				...options,
				headers: {
					'Authorization': `Bearer ${accessToken}`,
					'Content-Type': 'application/json',
					...options.headers
				}
			});
			if (response.status === 204) return true;
			return await response.json();
		} catch (e) {
			console.error("API Error:", e);
			return null;
		}
	}
	
	// ВЫЧИСЛЕНИЕ И ФИЛЬТРАЦИЯ ПЛЕЙЛИСТОВ (Strict BPM Filter)
	function isPlaylistStrictEnough(name, targetBpm) {
		const nums = name.match(/\d+/g);
		if (!nums) return false;
		const parsedNums = nums.map(Number);
		
		if (parsedNums.length >= 2 && (Math.max(...parsedNums) - Math.min(...parsedNums) > 4)) {
			return false;
		}
		return parsedNums.some(n => Math.abs(n - targetBpm) <= 4);
	}
	
	// ПОИСК И ВОСПРОИЗВЕДЕНИЕ
	async function searchAndPlay() {
		syncBtn.disabled = true;
		syncBtn.innerText = "SCANNING...";
		updateStatus("SEARCHING RHYTHM MATCHES...");
		
		const rawBpm = currentCadence < 100 ? currentCadence * 2 : currentCadence;
		const targetBpm = 5 * Math.round(rawBpm / 5);
		
		const activeGenres = Object.keys(genreStates).filter(g => genreStates[g]);
		let queries = [];
		
		if (activeGenres.length === 0) {
			const tags = ["workout", "training", "gym", "energy", "power", "cycling"];
			const randomTags = tags.sort(() => 0.5 - Math.random()).slice(0, 3);
			queries = randomTags.map(t => `${targetBpm} BPM ${t}`);
		} else {
			queries = activeGenres.map(g => `${targetBpm} BPM ${g.toLowerCase()}`);
		}
		
		let pool = [];
		for (const q of queries) {
			// Лимит по 10 элементов, аналогично логике с исправлением Spotify API
			for (const offset of [0, 10]) {
				const data = await spotifyFetch(`/search?q=${encodeURIComponent(q)}&type=playlist&limit=10&offset=${offset}`);
				if (data && data.playlists && data.playlists.items) {
					data.playlists.items.forEach(pl => {
						if (pl && isPlaylistStrictEnough(pl.name, targetBpm)) {
							pool.push(pl);
						}
					});
				}
			}
		}
		
		if (pool.length > 0) {
			const selectedPl = pool[Math.floor(Math.random() * pool.length)];
			const devicesData = await spotifyFetch('/me/player/devices');
			
			if (devicesData && devicesData.devices && devicesData.devices.length > 0) {
				const deviceId = devicesData.devices[0].id;
				
				await spotifyFetch(`/me/player/play?device_id=${deviceId}`, {
					method: 'PUT',
					body: JSON.stringify({ context_uri: selectedPl.uri })
				});
				
				updateStatus(`SYNC: ${selectedPl.name.substring(0, 20)}`);
			} else {
				updateStatus("ERR: NO ACTIVE SPOTIFY DEVICE FOUND");
			}
		} else {
			updateStatus("NO EXACT MATCH FOUND");
		}
		
		syncBtn.disabled = false;
		syncBtn.innerText = "⚡ SYNC/RES RHYTHM";
	}
	
	// --- 4. МОНИТОРИНГ ТРЕКА И ПАНЕЛЬ УПРАВЛЕНИЯ ---
	function startPlaybackMonitoring() {
		setInterval(async () => {
			const current = await spotifyFetch('/me/player');
			if (current && current.item) {
				if (current.item.id !== lastTrackId) {
					lastTrackId = current.item.id;
					
					// Проверка, лайкнут ли трек
					const likedData = await spotifyFetch(`/me/tracks/contains?ids=${lastTrackId}`);
					const isLiked = likedData ? likedData[0] : false;
					
					// Обновление UI
					trackLabel.innerText = `TRK: ${current.item.name.substring(0, 35)}`;
					artistLabel.innerText = `ART: ${current.item.artists[0].name.substring(0, 40)}`;
					
					if (current.context && current.context.type === 'playlist') {
						const plId = current.context.uri.split(':').pop();
						const plData = await spotifyFetch(`/playlists/${plId}?fields=name`);
						if (plData) playlistLabel.innerText = `PL: ${plData.name.substring(0, 45)}`;
					}
					
					likeBtn.classList.toggle('liked', isLiked);
				}
			}
		}, 5000);
	}
	
	async function togglePause() {
		const player = await spotifyFetch('/me/player');
		if (player && player.is_playing) {
			await spotifyFetch('/me/player/pause', { method: 'PUT' });
		} else {
			await spotifyFetch('/me/player/play', { method: 'PUT' });
		}
	}
	
	async function nextTrack() { await spotifyFetch('/me/player/next', { method: 'POST' }); }
	async function prevTrack() { await spotifyFetch('/me/player/previous', { method: 'POST' }); }
	
	async function likeCurrentTrack() {
		if (!lastTrackId) return;
		await spotifyFetch(`/me/tracks?ids=${lastTrackId}`, { method: 'PUT' });
		likeBtn.classList.add('liked');
		updateStatus("ADDED TO LIKED");
	}
	
	async function saveCurrentPlaylist() {
		const player = await spotifyFetch('/me/player');
		if (player && player.context && player.context.type === 'playlist') {
			const plId = player.context.uri.split(':').pop();
			await spotifyFetch(`/playlists/${plId}/followers`, { method: 'PUT' });
			updateStatus("PLAYLIST SAVED");
		} else {
			updateStatus("ERR: NO PLAYLIST PLAYING");
		}
	}
	
	function updateStatus(msg) {
		statusBar.innerText = `SYS: ${msg.toUpperCase()}`;
	}
	
	// Старт   работы
	setupUI();
	initSpotifyAuth();
</script>
</body>
</html>
